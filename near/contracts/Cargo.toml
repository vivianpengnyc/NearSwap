[package]
name = "htlc"
version = "0.1.0"
edition = "2021"

[lib]
name = "htlc"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.5.0"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
schemars = "0.8"

[dev-dependencies]
near-sdk = { version = "5.5.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.16.1-rust-1.78.0"
container_url = "https://hub.docker.com/r/sourcescan/cargo-near"