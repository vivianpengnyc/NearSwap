[package]
name = "htlc"
version = "0.1.0"
edition = "2021"

[lib]
name = "htlc"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.5.0"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true